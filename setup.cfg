[develop]
script_dir=$base/lib/openxr_ros2_bridge
[install]
install_scripts=$base/lib/openxr_ros2_bridge
[flake8]
# ament_flake8's defaults with the house style of this package: double quotes, lines up to 120 characters
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
application-import-names = openxr_ros2_bridge
max-line-length = 120
inline-quotes = "
multiline-quotes = """
docstring-quotes = """
show-source = true
statistics = true
